name: Export current Grok Ultra parity source

on:
  push:
    branches:
      - agent/grok-ultra-selfuse
    paths:
      - .github/workflows/export-ultra-parity-source.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-ultra-parity-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/grok-ultra-selfuse
          fetch-depth: 1
      - name: Archive source
        run: |
          tar --exclude=.git --exclude=target --exclude=dist -czf /tmp/grok-ultra-parity-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: grok-ultra-parity-source
          path: /tmp/grok-ultra-parity-source.tar.gz
          if-no-files-found: error
          retention-days: 1
