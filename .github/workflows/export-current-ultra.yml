name: Export current Grok Ultra branch source

on:
  push:
    branches:
      - agent/grok-ultra-selfuse
    paths:
      - .github/workflows/export-current-ultra.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-current-ultra.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/grok-ultra-selfuse
          fetch-depth: 1
      - name: Package exact branch source
        run: git archive --format=tar.gz --output=current-ultra-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: current-ultra-source
          path: current-ultra-source.tar.gz
          if-no-files-found: error
          retention-days: 2
