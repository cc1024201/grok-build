name: Validate isolated Grok Ultra distribution

on:
  push:
    branches:
      - agent/grok-ultra-selfuse
    paths:
      - scripts/build-grok-ultra.sh
      - scripts/install-grok-ultra.sh
      - scripts/uninstall-grok-ultra.sh
      - scripts/test-grok-ultra-isolation.sh
      - scripts/build-grok-ultra.ps1
      - scripts/install-grok-ultra.ps1
      - scripts/uninstall-grok-ultra.ps1
      - docs/grok-ultra-isolation.md
      - .github/workflows/validate-grok-ultra-isolation.yml
      - crates/codegen/xai-grok-agent/**
      - crates/codegen/xai-grok-shell/**
      - crates/codegen/xai-grok-tools/**
      - crates/codegen/xai-grok-pager/**
      - crates/codegen/xai-grok-pager-bin/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  pull_request:
    branches:
      - main
    paths:
      - scripts/build-grok-ultra.sh
      - scripts/install-grok-ultra.sh
      - scripts/uninstall-grok-ultra.sh
      - scripts/test-grok-ultra-isolation.sh
      - scripts/build-grok-ultra.ps1
      - scripts/install-grok-ultra.ps1
      - scripts/uninstall-grok-ultra.ps1
      - docs/grok-ultra-isolation.md
      - .github/workflows/validate-grok-ultra-isolation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-isolation-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/grok-ultra-selfuse
          fetch-depth: 1

      - name: Validate shell scripts
        run: |
          bash -n scripts/build-grok-ultra.sh
          bash -n scripts/install-grok-ultra.sh
          bash -n scripts/uninstall-grok-ultra.sh
          bash -n scripts/test-grok-ultra-isolation.sh
          bash scripts/test-grok-ultra-isolation.sh

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: grok-ultra-isolated-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            grok-ultra-final-${{ runner.os }}-
            grok-ultra-v2-surface-${{ runner.os }}-
            grok-ultra-selfuse-${{ runner.os }}-

      - name: Install DotSlash
        run: command -v dotslash >/dev/null || cargo install dotslash --locked

      - name: Build isolated package
        run: bash scripts/build-grok-ultra.sh

      - name: Smoke test isolated launcher
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/home" "$tmp/official"
          printf 'do-not-touch\n' > "$tmp/official/sentinel"
          HOME="$tmp/home" \
            GROK_HOME="$tmp/official" \
            GROK_AUTH_PATH="$tmp/official/auth.json" \
            dist/grok-ultra-linux-x86_64/bin/grok-ultra --version
          test "$(cat "$tmp/official/sentinel")" = "do-not-touch"
          test ! -e "$tmp/official/auth.json"
          test ! -e "$tmp/home/.grok"

      - name: Upload isolated Linux package
        uses: actions/upload-artifact@v4
        with:
          name: grok-ultra-linux-x86_64-isolated
          path: |
            dist/grok-ultra-linux-x86_64.tar.gz
            dist/grok-ultra-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  windows-launcher-isolation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/grok-ultra-selfuse
          fetch-depth: 1

      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            'scripts/build-grok-ultra.ps1',
            'scripts/install-grok-ultra.ps1',
            'scripts/uninstall-grok-ultra.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$path failed to parse: $($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Exercise generated cmd launcher
        shell: pwsh
        run: |
          $source = Get-Content scripts/build-grok-ultra.ps1 -Raw
          $pattern = '(?s)\$Launcher = @''\r?\n(.*?)\r?\n''@'
          $match = [regex]::Match($source, $pattern)
          if (-not $match.Success) { throw 'Unable to extract grok-ultra.cmd launcher template' }

          $root = Join-Path $env:RUNNER_TEMP 'grok-ultra-launcher-test'
          $bin = Join-Path $root 'bin'
          $libexec = Join-Path $root 'libexec'
          New-Item $bin -ItemType Directory -Force | Out-Null
          New-Item $libexec -ItemType Directory -Force | Out-Null
          Set-Content (Join-Path $bin 'grok-ultra.cmd') $match.Groups[1].Value -Encoding Ascii
          Copy-Item $env:ComSpec (Join-Path $libexec 'grok-ultra-core.exe')
          $launcher = Join-Path $bin 'grok-ultra.cmd'

          function Invoke-Launcher([string[]]$LauncherArgs) {
            $token = [Guid]::NewGuid().ToString('N')
            $stdoutPath = Join-Path $root "$token.stdout"
            $stderrPath = Join-Path $root "$token.stderr"
            $commandLine = '"' + $launcher + '" ' + ($LauncherArgs -join ' ')
            $process = Start-Process -FilePath $env:ComSpec \
              -ArgumentList @('/d', '/c', $commandLine) \
              -Wait -PassThru -NoNewWindow \
              -RedirectStandardOutput $stdoutPath \
              -RedirectStandardError $stderrPath
            [pscustomobject]@{
              ExitCode = $process.ExitCode
              Stdout = if (Test-Path $stdoutPath) { Get-Content $stdoutPath -Raw } else { '' }
              Stderr = if (Test-Path $stderrPath) { Get-Content $stderrPath -Raw } else { '' }
            }
          }

          $env:GROK_HOME = 'C:\official-grok'
          $env:GROK_AUTH_PATH = 'C:\official-grok\auth.json'
          $env:GROK_LEADER_SOCKET = 'C:\official-grok\leader.sock'
          $env:GROK_SESSION_PATH = 'C:\official-grok\session.json'
          Remove-Item Env:GROK_ULTRA_HOME -ErrorAction SilentlyContinue
          Remove-Item Env:GROK_ULTRA_AUTH_PATH -ErrorAction SilentlyContinue

          $normal = Invoke-Launcher @('/c', 'set', 'GROK_')
          Write-Host $normal.Stdout
          if ($normal.ExitCode -ne 0) {
            throw "launcher failed: $($normal.ExitCode)`nstdout:`n$($normal.Stdout)`nstderr:`n$($normal.Stderr)"
          }
          $expectedHome = Join-Path $env:USERPROFILE '.grok-ultra'
          if ($normal.Stdout -notmatch [regex]::Escape("GROK_HOME=$expectedHome")) {
            throw "isolated home missing:`n$($normal.Stdout)"
          }
          if ($normal.Stdout -notmatch [regex]::Escape("GROK_AUTH_PATH=$expectedHome\auth.json")) {
            throw "isolated auth path missing:`n$($normal.Stdout)"
          }
          if ($normal.Stdout -notmatch 'GROK_AGENT=grok-build-ultra') { throw $normal.Stdout }
          if ($normal.Stdout -notmatch 'GROK_DISABLE_AUTOUPDATER=1') { throw $normal.Stdout }
          if ($normal.Stdout -match 'C:\\official-grok\\leader.sock|C:\\official-grok\\session.json') {
            throw "official leader/session leaked:`n$($normal.Stdout)"
          }

          $update = Invoke-Launcher @('update')
          if ($update.ExitCode -ne 2) {
            throw "update command was not refused: $($update.ExitCode)`n$($update.Stderr)"
          }

          $env:GROK_ULTRA_HOME = Join-Path $env:USERPROFILE '.grok'
          $officialHome = Invoke-Launcher @('/c', 'exit', '0')
          if ($officialHome.ExitCode -ne 2) {
            throw "official state root was not refused: $($officialHome.ExitCode)`n$($officialHome.Stderr)"
          }
