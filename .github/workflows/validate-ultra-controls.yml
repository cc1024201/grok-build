name: Validate and publish Ultra collaboration controls

on:
  push:
    branches:
      - agent/grok-ultra-selfuse
    paths:
      - .github/apply-ultra-controls.py
      - .github/workflows/validate-ultra-controls.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/apply-ultra-controls.py
      - .github/workflows/validate-ultra-controls.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grok-ultra-controls-publish
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/grok-ultra-selfuse
          fetch-depth: 0
          persist-credentials: true

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: grok-ultra-controls-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            grok-ultra-selfuse-${{ runner.os }}-
            grok-ultra-upstream-${{ runner.os }}-
            grok-ultra-${{ runner.os }}-

      - name: Apply verified collaboration controls
        run: python .github/apply-ultra-controls.py

      - name: Install DotSlash
        run: command -v dotslash >/dev/null || cargo install dotslash --locked

      - name: Format sources
        run: cargo fmt --all

      - name: Test Ultra control tool identities
        run: cargo test -p xai-grok-tools --lib control_tools_have_stable_ids

      - name: Test Ultra agent profile and tool exposure
        run: cargo test -p xai-grok-agent --lib grok_build_ultra_is_a_full_tool_execution_profile

      - name: Check tool runtime
        run: cargo check -p xai-grok-tools

      - name: Check shell runtime
        run: cargo check -p xai-grok-shell

      - name: Check terminal application composition
        run: cargo check -p xai-grok-pager-bin

      - name: Publish formatted source
        run: |
          set -euo pipefail
          rm .github/apply-ultra-controls.py
          rm .github/workflows/validate-ultra-controls.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Ultra subagent collaboration controls"
          git push origin HEAD:agent/grok-ultra-selfuse
