name: Validate and publish Grok Ultra core

on:
  push:
    branches:
      - agent/grok-ultra-selfuse
    paths:
      - .github/ultra-core.patch
      - .github/workflows/export-ultra-sources.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grok-ultra-selfuse-publish
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/grok-ultra-selfuse
          fetch-depth: 0
          persist-credentials: true

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: grok-ultra-selfuse-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            grok-ultra-upstream-${{ runner.os }}-
            grok-ultra-${{ runner.os }}-

      - name: Apply implementation patch
        run: |
          set -euo pipefail
          git apply --check .github/ultra-core.patch
          git apply .github/ultra-core.patch

      - name: Install DotSlash
        run: command -v dotslash >/dev/null || cargo install dotslash --locked

      - name: Format sources
        run: cargo fmt --all

      - name: Test Ultra agent profile
        run: cargo test -p xai-grok-agent --lib grok_build_ultra_is_a_full_tool_execution_profile

      - name: Test profile policy propagation
        run: cargo test -p xai-grok-tools --lib execution_policy_forks_context_and_waits_for_admission

      - name: Test truthful background rejection
        run: cargo test -p xai-grok-tools --lib background_admission_rejection_is_returned_to_the_model

      - name: Test atomic concurrent admission
        run: cargo test -p xai-grok-tools --lib execution_policy_admission_is_atomic_under_concurrent_spawns

      - name: Check shell runtime
        run: cargo check -p xai-grok-shell

      - name: Check terminal application composition
        run: cargo check -p xai-grok-pager-bin

      - name: Publish formatted source
        run: |
          set -euo pipefail
          rm .github/ultra-core.patch
          rm .github/workflows/export-ultra-sources.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add self-usable Grok Ultra agent profile"
          git push origin HEAD:agent/grok-ultra-selfuse
