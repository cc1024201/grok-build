name: Finalize Grok Ultra self-use candidate

on:
  push:
    branches:
      - agent/grok-ultra-selfuse
    paths:
      - .github/apply-ultra-effort-final.py
      - .github/workflows/finalize-ultra-selfuse.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/apply-ultra-effort-final.py
      - .github/workflows/finalize-ultra-selfuse.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grok-ultra-selfuse-finalize
  cancel-in-progress: true

jobs:
  validate-build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BASELINE_IMAGE_TEST: crates/codegen/xai-grok-shell/src/session/acp_session_tests/tool_layer_images_bridge_tests.rs
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/grok-ultra-selfuse
          fetch-depth: 0
          persist-credentials: true

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: grok-ultra-final-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            grok-ultra-v2-surface-${{ runner.os }}-
            grok-ultra-controls-${{ runner.os }}-
            grok-ultra-selfuse-${{ runner.os }}-

      - name: Apply final effort and model-switch integration
        run: python .github/apply-ultra-effort-final.py

      - name: Apply test-only upstream base64 compatibility shim
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["BASELINE_IMAGE_TEST"])
          text = path.read_text(encoding="utf-8")
          marker = "use super::*;\n"
          insertion = marker + "use base64::Engine as _;\n"
          if "use base64::Engine" not in text:
              if text.count(marker) != 1:
                  raise SystemExit("unexpected upstream image-test import layout")
              path.write_text(text.replace(marker, insertion, 1), encoding="utf-8")
          PY

      - name: Install DotSlash
        run: command -v dotslash >/dev/null || cargo install dotslash --locked

      - name: Format sources
        run: cargo fmt --all

      - name: Test Ultra profile and Codex-style tool surface
        run: |
          cargo test -p xai-grok-agent --lib grok_build_ultra_is_a_full_tool_execution_profile
          cargo test -p xai-grok-tools --lib control_tools_have_stable_ids

      - name: Test highest-effective reasoning effort
        run: |
          cargo test -p xai-grok-shell --lib agent_profile_effort_uses_strongest_advertised_level
          cargo test -p xai-grok-shell --lib agent_profile_effort_uses_catalog_default_when_menu_is_missing

      - name: Test bounded admission and truthful background startup
        run: |
          cargo test -p xai-grok-tools --lib execution_policy_forks_context_and_waits_for_admission
          cargo test -p xai-grok-tools --lib background_admission_rejection_is_returned_to_the_model
          cargo test -p xai-grok-tools --lib execution_policy_admission_is_atomic_under_concurrent_spawns

      - name: Check runtime crates
        run: |
          cargo check -p xai-grok-tools
          cargo check -p xai-grok-shell
          cargo check -p xai-grok-pager-bin

      - name: Build release binary
        run: cargo build -p xai-grok-pager-bin --release

      - name: Publish real source and remove migration helpers
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree -- "$BASELINE_IMAGE_TEST"
          rm -f \
            .github/apply-ultra-effort-final.py \
            .github/apply-ultra-phase4.py \
            .github/apply-ultra-v2-surface.py \
            .github/ultra-agent-control.b85 \
            .github/ultra-grok-mod.b85 \
            .github/workflows/finalize-ultra-selfuse.yml \
            .github/workflows/validate-ultra-v2-surface.yml \
            .github/workflows/export-current-ultra.yml \
            .github/workflows/export-ultra-phase4-patch.yml \
            .github/workflows/export-ultra-selfuse.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize self-usable Grok Ultra mode"
          git push origin HEAD:agent/grok-ultra-selfuse

      - name: Upload Linux release binary
        uses: actions/upload-artifact@v4
        with:
          name: grok-ultra-linux-x86_64
          path: target/release/xai-grok-pager
          if-no-files-found: error
          retention-days: 7
