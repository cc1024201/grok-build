name: Validate and publish Codex-style Ultra surface

on:
  push:
    branches:
      - agent/grok-ultra-selfuse
    paths:
      - .github/apply-ultra-v2-surface.py
      - .github/ultra-agent-control.b85
      - .github/ultra-grok-mod.b85
      - .github/workflows/validate-ultra-v2-surface.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/apply-ultra-v2-surface.py
      - .github/ultra-agent-control.b85
      - .github/ultra-grok-mod.b85
      - .github/workflows/validate-ultra-v2-surface.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grok-ultra-v2-surface-publish
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/grok-ultra-selfuse
          fetch-depth: 0
          persist-credentials: true

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: grok-ultra-v2-surface-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            grok-ultra-controls-${{ runner.os }}-
            grok-ultra-selfuse-${{ runner.os }}-
            grok-ultra-${{ runner.os }}-

      - name: Apply verified V2 surface
        run: |
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import subprocess
          import zlib
          from pathlib import Path

          source = Path('.github/apply-ultra-v2-surface.py').read_text()
          values = {}
          for node in ast.parse(source).body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  try:
                      values[node.targets[0].id] = ast.literal_eval(node.value)
                  except Exception:
                      pass
          patch = zlib.decompress(base64.b85decode(values['PAYLOAD'].encode()))
          actual = hashlib.sha256(patch).hexdigest()
          if actual != values['EXPECTED_SHA256']:
              raise SystemExit(f'V2 patch checksum mismatch: {actual}')

          excluded = [
              'crates/codegen/xai-grok-tools/src/implementations/grok_build/agent_control.rs',
              'crates/codegen/xai-grok-tools/src/implementations/grok_build/mod.rs',
          ]
          args = ['git', 'apply'] + [arg for path in excluded for arg in ('--exclude', path)] + ['-']
          subprocess.run(args[:2] + ['--check'] + args[2:], input=patch, check=True)
          subprocess.run(args, input=patch, check=True)

          targets = [
              (
                  Path('.github/ultra-agent-control.b85'),
                  Path(excluded[0]),
                  '413dd1ce3cfd62e38a9ef407394a685d5348cfd64c51ed5969093dfef4dcee7d',
              ),
              (
                  Path('.github/ultra-grok-mod.b85'),
                  Path(excluded[1]),
                  'c0ff2c5f2310767f0f6f8451e40b57aba09b96e6487d7f0dc2b93b0ceeabdb76',
              ),
          ]
          for payload_path, target_path, expected in targets:
              data = zlib.decompress(base64.b85decode(payload_path.read_text().strip().encode()))
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{target_path} checksum mismatch: {actual}')
              target_path.write_bytes(data)
          PY

      - name: Install DotSlash
        run: command -v dotslash >/dev/null || cargo install dotslash --locked

      - name: Format sources
        run: cargo fmt --all

      - name: Test Codex-style control identities
        run: cargo test -p xai-grok-tools --lib control_tools_have_stable_ids

      - name: Test Ultra profile and exact model-facing names
        run: cargo test -p xai-grok-agent --lib grok_build_ultra_is_a_full_tool_execution_profile

      - name: Check tool runtime
        run: cargo check -p xai-grok-tools

      - name: Check shell runtime
        run: cargo check -p xai-grok-shell

      - name: Check terminal application composition
        run: cargo check -p xai-grok-pager-bin

      - name: Publish formatted source
        run: |
          set -euo pipefail
          rm .github/apply-ultra-v2-surface.py
          rm .github/ultra-agent-control.b85
          rm .github/ultra-grok-mod.b85
          rm .github/workflows/validate-ultra-v2-surface.yml
          rm -f .github/workflows/export-current-ultra.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose Codex-style Ultra agent controls"
          git push origin HEAD:agent/grok-ultra-selfuse
