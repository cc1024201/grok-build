name: Export formatted Grok Ultra source

on:
  push:
    branches:
      - agent/grok-ultra-selfuse
    paths:
      - .github/workflows/export-ultra-selfuse.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-ultra-selfuse.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/grok-ultra-selfuse
          fetch-depth: 1
      - name: Package source
        run: git archive --format=tar.gz --output=grok-ultra-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: grok-ultra-source
          path: grok-ultra-source.tar.gz
          if-no-files-found: error
          retention-days: 2
