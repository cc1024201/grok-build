name: Apply and validate Grok Ultra

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/apply_grok_ultra.py
      - .github/recover_and_apply_grok_ultra.py
      - .github/workflows/apply-grok-ultra.yml

permissions:
  contents: write

concurrency:
  group: grok-ultra-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: grok-ultra-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          save-always: true

      - name: Apply Ultra source changes
        run: python .github/recover_and_apply_grok_ultra.py

      - name: Install DotSlash
        run: command -v dotslash >/dev/null || cargo install dotslash --locked

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Test Ultra wire semantics
        run: cargo test -p xai-grok-sampling-types --test ultra

      - name: Test sampling types
        run: cargo test -p xai-grok-sampling-types

      - name: Check subagent runtime
        run: cargo check -p xai-grok-tools

      - name: Check Grok shell integration
        run: cargo check -p xai-grok-shell

      - name: Check terminal application
        run: cargo check -p xai-grok-pager-bin

      - name: Verify diff and publish implementation
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          rm .github/apply_grok_ultra.py
          rm .github/recover_and_apply_grok_ultra.py
          rm .github/workflows/apply-grok-ultra.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Grok Ultra orchestration"
          git push origin "HEAD:${BRANCH}"
